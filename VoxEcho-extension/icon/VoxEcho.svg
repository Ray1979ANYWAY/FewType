<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：暗墨绿黑圆角矩形 -->
  <rect width="512" height="512" rx="115" fill="url(#bg-moss-black)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" stroke="#34D399" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 外围 Echo 环（极度扩展，半径拉大到 220px，紧贴边缘） -->
  <path d="M 36 256 A 220 220 0 1 1 476 256" stroke="url(#emerald-ring)" stroke-width="20" stroke-linecap="round"/>

  <!-- 中央 3 根暴击级放大的核心发光声波（几乎填满视窗） -->
  <!-- 左声波 (加宽到 64px，高度 210px) -->
  <rect x="120" y="151" width="64" height="210" rx="32" fill="url(#mint-wave)"/>
  
  <!-- 中主声波 (加宽到 72px，高度达 410px，纵向爆框) -->
  <rect x="220" y="51" width="72" height="410" rx="36" fill="url(#mint-wave)"/>
  
  <!-- 右声波 (加宽到 64px，高度 210px) -->
  <rect x="328" y="151" width="64" height="210" rx="32" fill="url(#mint-wave)"/>

  <defs>
    <!-- 1. 背景：极深墨绿黑 -->
    <linearGradient id="bg-moss-black" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1E14"/>
      <stop offset="100%" stop-color="#030A06"/>
    </linearGradient>
    
    <!-- 2. 声波：薄荷荧光绿渐变 -->
    <linearGradient id="mint-wave" x1="256" y1="51" x2="256" y2="461" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="30%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 3. Echo 环：高亮电光绿 -> 暗翡翠绿 -->
    <linearGradient id="emerald-ring" x1="36" y1="36" x2="476" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
</svg>
