<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Text Extraction Preview</title>
    <style>
      /* ============ Moss Black 主题（与 launcher.py 对齐） ============ */
      :root {
        --bg: #090D0A;        /* 窗口背景：深极客墨黑 */
        --card: #121A15;      /* 卡片/容器背景：暗苔绿黑 */
        --card2: #0B1E14;     /* 强调容器：HUD 绿黑 */
        --accent: #10B981;    /* 翡翠绿 */
        --accent2: #34D399;   /* 薄荷荧光绿 */
        --text: #ECFDF5;      /* 主文字：高亮微绿白 */
        --muted: #6EE7B7;     /* 次要文字：薄荷绿 */
        --muted2: #6B7280;    /* 冷灰 */
        --input: #1A261F;     /* 输入/按钮背景 */
        --border: #27372D;    /* 边框 */
        --error: #F87171;     /* 错误红 */
        --warn: #F59E0B;      /* 警示黄 */
      }
      body {
        width: 380px;
        max-height: 560px;
        overflow-y: auto;
        font-family: -apple-system, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        padding: 12px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      /* 细暗色滚动条 */
      body::-webkit-scrollbar { width: 6px; }
      body::-webkit-scrollbar-track { background: transparent; }
      body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      body::-webkit-scrollbar-thumb:hover { background: var(--accent); }
      .item {
        margin-bottom: 8px;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        background: var(--card);
        border: 1px solid var(--border);
      }
      .body { color: var(--text); }
      .heading {
        background: var(--card2);
        border-color: var(--accent);
        font-weight: bold;
        color: var(--accent2);
      }
      .callout {
        background: var(--card2);
        border-left: 3px solid var(--accent);
        color: var(--muted);
      }
      .meta { font-size: 11px; color: var(--muted2); margin-bottom: 8px; word-break: break-all; }
      .toolbar { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
      .toolbar.nowrap { flex-wrap: nowrap; }
      button {
        cursor: pointer;
        background: var(--input);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        font-family: inherit;
        transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:active:not(:disabled) { background: var(--accent); color: #04120B; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      select {
        flex: 1;
        min-width: 100px;
        background: var(--input);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 12px;
        font-family: inherit;
      }
      select:focus { outline: none; border-color: var(--accent); }
      .status { font-size: 12px; margin-bottom: 8px; min-height: 16px; color: var(--muted2); }
      .status.error { color: var(--error); }
      .status.ok { color: var(--accent2); }
      .light {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--muted2);
        margin-left: 4px;
        vertical-align: middle;
      }
      .light.green { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
      .light.red { background: var(--error); box-shadow: 0 0 6px var(--error); }
      .hint {
        font-size: 11px;
        color: var(--muted2);
        margin-left: 4px;
        white-space: nowrap;
      }
      .annotation {
        font-size: 12px;
        color: var(--muted);
        background: var(--card2);
        border: 1px solid var(--accent);
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.15);
        border-radius: 8px;
        padding: 6px 10px;
        margin-bottom: 8px;
        line-height: 1.5;
      }
      .sponsor {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted2);
        text-decoration: none;
        line-height: 1.5;
        margin-left: 4px;
        flex: 1 1 auto;
        min-width: 0;
        word-break: break-word;
      }
      .sponsor svg { flex: 0 0 auto; }
      .sponsor:hover { color: var(--accent2); text-decoration: underline; }
      .bridge-notice {
        font-size: 11px;
        color: var(--warn);
        background: #1A1608;
        border: 1px solid #4A3A12;
        border-radius: 8px;
        padding: 6px 10px;
        margin-bottom: 8px;
        line-height: 1.5;
      }
      #lang { flex: 1 1 40%; min-width: 96px; }
      #voice { flex: 1 1 60%; min-width: 110px; }
      .select-label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        margin-right: 2px;
      }
      /* popup 布局调整：Start 占左跨两行大按钮，其他控件挤右侧两行 */
      .main-controls { display: flex; gap: 8px; margin-bottom: 8px; align-items: stretch; }
      #start {
        flex: 0 0 26%;
        min-height: 64px;
        padding: 10px 12px;
        font-size: 15px;
        font-weight: 700;
        background: var(--card2);
        border: 1px solid var(--accent);
        color: var(--accent2);
        border-radius: 8px;
      }
      #start:hover:not(:disabled) { border-color: var(--accent2); background: var(--card); }
      .right-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .right-col .toolbar { margin-bottom: 0; flex-wrap: nowrap; }
      #rate { flex: 1 1 auto; min-width: 54px; padding: 4px 6px; }
      #refresh { margin-left: auto; padding: 4px 8px; }
      .refresh-hint {
        font-size: 11px;
        color: var(--muted2);
        margin-bottom: 8px;
        padding: 4px 8px;
        background: var(--card);
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .voice-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(9, 13, 10, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 9999;
        backdrop-filter: blur(4px);
      }
      .voice-loading[hidden] {
        display: none;
      }
      .voice-loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-top-color: var(--accent2);
        border-radius: 50%;
        animation: voice-spin 0.8s linear infinite;
      }
      @keyframes voice-spin {
        to { transform: rotate(360deg); }
      }
      .voice-loading-text {
        font-size: 13px;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="voiceLoading" class="voice-loading" hidden>
      <span class="voice-loading-spinner"></span>
      <span class="voice-loading-text" data-i18n="voicesLoading">音色正在加载中…</span>
    </div>
    <div class="toolbar nowrap">
      <label for="lang" class="select-label" data-i18n="langLabel">语言</label>
      <select id="lang" aria-label="language"></select>
      <label for="voice" class="select-label" data-i18n="voiceLabel">音色</label>
      <select id="voice"></select>
    </div>
    <div class="refresh-hint">
      <div data-i18n="refreshHint">如果没有抓取到文本，请按 F5 刷新页面</div>
      <div class="hint" data-i18n="hotkeyHint" style="margin-left:0; margin-top:2px">Press . to pause/resume</div>
    </div>
    <div class="main-controls">
      <button id="start" data-i18n="start">🔊 Start Reading</button>
      <div class="right-col">
        <div class="toolbar">
          <label for="rate" data-i18n="rateLabel">Speed</label>
          <select id="rate">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2x</option>
          </select>
          <button id="refresh" data-i18n="refresh">Refresh</button>
        </div>
        <div class="toolbar">
          <button id="pauseResume">⏸ Pause</button>
          <button id="stop" data-i18n="stop">⏹ Stop</button>
          <span id="statusLight" class="light" title="Gray=idle, green=reading, red=retrying"></span>
        </div>
      </div>
    </div>
    <div id="bridgeNotice" class="bridge-notice" hidden></div>
    <div class="annotation" id="startAnnotation" data-i18n="startAnnotation">Start reading from the selected text, or from the beginning of the page.</div>
    <div class="toolbar">
      <a id="sponsorLink" class="sponsor" href="https://ko-fi.com/rayhu" target="_blank" rel="noopener noreferrer">

        <span data-i18n="sponsor">If you find VoxEcho helpful, consider buying me a coffee!</span>
      </a>
    </div>
    <div class="toolbar">
      <button id="exportLog" data-i18n="exportLog">📋 Export Log</button>
      <button id="clearLog" data-i18n="clearLog">🗑 Clear Log</button>
    </div>
    <div class="status" id="status"></div>
    <div class="meta" id="meta" data-i18n="metaEmpty">Not extracted yet</div>
    <div id="list"></div>
    <script src="popup.js"></script>
  </body>
</html>
